<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Où va l'argent d'Ormstown — Ormstown Observer</title>
<meta name="description" content="Les listes de dépenses approuvées par le conseil d'Ormstown, mois par mois, avec chaque total vérifiable dans les procès-verbaux officiels. / Ormstown's council-approved expense lists, verifiable in the official minutes.">
<link rel="canonical" href="https://ormstownobserver.ca/finances/">
<style>
:root{
  --paper:#fafaf7; --card:#ffffff; --ink:#1f2733; --ink-soft:#5a6572; --muted:#6d7783;
  --line:#e4e2dc; --accent:#2c5f7c; --accent-soft:#eaf1f5; --accent-dim:#a8c4d4;
  --paper-dark:#f1efe9; --focus:#184b66;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *,*::before,*::after{transition:none!important;animation:none!important} }
body{font-family:Georgia,'Times New Roman',serif;background:var(--paper);color:var(--ink);line-height:1.55}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.wrap{max-width:1060px;margin:0 auto;padding:12px 18px 64px}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:2px}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:#fff;padding:10px 16px;z-index:99;font-family:-apple-system,sans-serif}
.skip:focus{left:8px;top:8px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
button, select, input[type=search], input[type=text]{font:inherit}

/* ---------- Masthead (compact) ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;flex-wrap:wrap}
.back-link{font:700 .72rem/1 -apple-system,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);text-decoration:none;padding:14px 8px 14px 0;display:inline-flex;align-items:center;min-height:44px}
.back-link:hover{color:var(--accent)}
.eyebrow{font:700 .7rem/1.3 -apple-system,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.lang-group{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang-group button{min-width:52px;min-height:44px;padding:0 14px;border:0;background:transparent;color:var(--ink-soft);font:700 .8rem -apple-system,sans-serif;cursor:pointer}
.lang-group button[aria-pressed="true"]{background:var(--accent);color:#fff}
.masthead{border-bottom:3px double var(--ink);padding:2px 0 14px}
.masthead h1{font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:700;letter-spacing:.2px}
.masthead .dek{color:var(--ink-soft);font-size:1rem;max-width:62ch;margin-top:4px}
.statusline{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-top:8px;font:600 .82rem/1.5 -apple-system,sans-serif;color:var(--ink)}
.statusline .upd{color:var(--muted);font-weight:400}
.courtesy{font:.78rem/1.55 -apple-system,sans-serif;color:var(--ink-soft);border-left:3px solid var(--accent-dim);padding:6px 12px;margin-top:10px;max-width:80ch}

/* ---------- Section chrome ---------- */
section{margin-top:34px}
section > h2{font-size:1.3rem;font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:6px}
.section-sub{color:var(--ink-soft);font-size:.94rem;max-width:72ch;margin-bottom:12px}
.layer-tag{display:block;font:700 .68rem/1 -apple-system,sans-serif;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);margin-bottom:4px}

/* ---------- Snapshot ---------- */
#snapshot{margin-top:18px}
.snap-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.fact .l{font:600 .72rem/1.35 -apple-system,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.fact .v{font:700 1.3rem/1.25 -apple-system,sans-serif;color:var(--accent);margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fact .s{font:.78rem/1.4 -apple-system,sans-serif;color:var(--ink-soft);margin-top:2px}
.evidence{font:.86rem/1.55 -apple-system,sans-serif;margin-top:10px;padding:9px 12px;background:var(--accent-soft);border-left:3px solid var(--accent);max-width:100%}
.evidence a{font-weight:700}

/* ---------- Charts & figures ---------- */
figure{margin:0}
.chartbox{position:relative;width:100%}
.chartbox.trend{height:230px}
.chartbox.cats{height:380px}
.chartbox.budget{height:430px}
figcaption{font:.8rem/1.5 -apple-system,sans-serif;color:var(--ink-soft);margin-top:6px}
.legend-cues{display:flex;flex-wrap:wrap;gap:4px 18px;list-style:none}
details.datatable{margin-top:8px;font-family:-apple-system,sans-serif}
details.datatable > summary{cursor:pointer;font:600 .84rem/1.4 -apple-system,sans-serif;color:var(--accent);padding:10px 2px;min-height:44px;display:flex;align-items:center}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-family:-apple-system,sans-serif;font-size:.88rem}
caption{text-align:left;font:600 .8rem/1.5 -apple-system,sans-serif;color:var(--ink-soft);padding:4px 0 6px}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--line)}
th.num{text-align:right}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td .gloss, th .gloss{display:block;color:var(--ink-soft);font-size:.78rem;font-weight:400;text-transform:none;letter-spacing:0}
th button.sortbtn{background:none;border:0;cursor:pointer;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;padding:10px 6px;min-height:44px;display:inline-flex;align-items:center;gap:4px}
tbody th[scope=row]{font-size:.88rem;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600;border-bottom:1px solid var(--line)}
.grouphead td{background:var(--paper-dark);font:700 .74rem/1.3 -apple-system,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;flex:none;vertical-align:baseline}

/* ---------- Explore controls ---------- */
.controls{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.field label,.field .field-label{display:block;font:600 .74rem/1.4 -apple-system,sans-serif;color:var(--ink);margin-bottom:3px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:0 16px;border:1px solid var(--line);background:var(--card);border-radius:999px;font:600 .84rem -apple-system,sans-serif;color:var(--ink-soft);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg button[aria-pressed="true"] .dot{outline:1.5px solid #fff}
.seg button:hover{border-color:var(--accent)}
.field select,.field input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:0 10px;font:.9rem -apple-system,sans-serif}
.btn{min-height:44px;padding:0 16px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:700 .84rem -apple-system,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.secondary{background:var(--card);color:var(--accent)}
.btn:hover{filter:brightness(1.06)}
.summary{font:.95rem/1.5 -apple-system,sans-serif;margin:14px 0 4px;padding:10px 14px;background:var(--accent-soft);border-radius:8px}
.summary .big{font-weight:800;color:var(--accent);font-size:1.1rem}
.explore-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px;align-items:start}
.cat-list{list-style:none;font-family:-apple-system,sans-serif;font-size:.86rem}
.cat-list li{display:block;border-bottom:1px solid var(--line)}
.cat-list .rowline{display:flex;align-items:baseline;gap:8px;width:100%;padding:10px 6px;min-height:44px}
.catbtn{background:none;border:0;cursor:pointer;font:inherit;font-family:-apple-system,sans-serif;font-size:.86rem;color:var(--ink);text-align:left;width:100%}
.catbtn:hover .rowline{background:var(--paper-dark)}
.catbtn[aria-pressed="true"] .rowline{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.cat-list .nm{flex:1;min-width:0}
.cat-list .share{color:var(--ink-soft);font-size:.78rem}
.results-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.empty{color:var(--ink-soft);font:.92rem -apple-system,sans-serif;text-align:center;padding:26px 10px;border:1px dashed var(--line);border-radius:8px;margin-top:10px}

/* ---------- Signals ---------- */
.signals{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.signals h3{font-size:1rem;margin-bottom:2px}
.signals .note{font:.8rem/1.5 -apple-system,sans-serif;color:var(--ink-soft);margin-bottom:8px}
.signals ul{list-style:none;display:grid;gap:7px}
.signals li{border-left:3px solid var(--accent-dim);padding:7px 12px;background:var(--card);font:.86rem/1.5 -apple-system,sans-serif}

/* ---------- Annual & capital ---------- */
.acct-note{font:.88rem/1.6 -apple-system,sans-serif;background:var(--paper-dark);border-left:3px solid var(--accent);padding:10px 14px;max-width:82ch;margin-bottom:12px}
.scale-line{font-size:1rem;max-width:76ch;margin-bottom:6px}
.scale-tag{display:inline-block;font:700 .7rem/1.3 -apple-system,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-bottom:16px}
.budget-toolbar{display:flex;gap:10px;align-items:end;margin:10px 0;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-family:-apple-system,sans-serif}
.pcard h3{font-family:Georgia,serif;font-size:1.02rem;margin-bottom:8px}
.pcard dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.86rem}
.pcard dt{color:var(--ink-soft)}
.pcard dd{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.pcard .fund{margin-top:8px;font-size:.78rem;color:var(--ink-soft);line-height:1.5}
.pcard .pnote{margin-top:8px;font-size:.78rem;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:6px}

/* ---------- Verify ---------- */
#verify details{border:1px solid var(--line);border-radius:8px;background:var(--card);margin-top:10px;padding:0 14px}
#verify details > summary{cursor:pointer;font:600 .92rem/1.4 -apple-system,sans-serif;padding:12px 2px;min-height:44px;display:flex;align-items:center;color:var(--ink)}
#verify details[open] > summary{border-bottom:1px solid var(--line)}
#verify details .inner{padding:10px 2px 14px;font-size:.9rem}
#verify .inner li{margin:7px 0 7px 18px}
.doclist{list-style:none;font-family:-apple-system,sans-serif;font-size:.88rem}
.doclist li{padding:6px 0}

footer{margin-top:44px;padding-top:14px;border-top:1px solid var(--line);font:.8rem/1.7 -apple-system,sans-serif;color:var(--ink-soft);text-align:center}

/* ---------- Print ---------- */
.print-meta{display:none}
@media print{
  .topbar,.controls,.results-actions,.btn,.skip{display:none!important}
  body{background:#fff}
  .print-meta{display:block;font:.8rem/1.6 -apple-system,sans-serif;border:1px solid #999;padding:8px 12px;margin:10px 0}
  section{break-inside:avoid-page}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:.72rem;color:#555}
}

/* ---------- Mobile ---------- */
@media (max-width:900px){
  .snap-grid{grid-template-columns:1fr 1fr}
  .explore-grid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .wrap{padding:8px 12px 48px}
  .controls{position:sticky;top:0;z-index:30;box-shadow:0 4px 14px rgba(31,39,51,.08)}
  .chartbox.trend{height:190px}
  .chartbox.budget{height:520px}
  /* Stacked-card tables: suppliers, budget, coverage, trend */
  table.stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  table.stack, table.stack tbody, table.stack tr, table.stack td, table.stack th[scope=row]{display:block;width:100%}
  table.stack tr{border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:8px;padding:8px 12px}
  table.stack td, table.stack th[scope=row]{border:none;padding:2px 0;text-align:left}
  table.stack td.num{text-align:left}
  table.stack td[data-l]::before, table.stack th[data-l]::before{content:attr(data-l) " : ";font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
  table.stack tr.grouphead{background:var(--paper-dark);padding:6px 12px}
}
</style>
<script>
  // Site-wide language memory, set before paint so the first render is right.
  (function(){try{
    var q=new URLSearchParams(location.search).get('lang');
    var l=(q==='fr'||q==='en')?q:localStorage.getItem('observerLang');
    if(l==='en'){document.documentElement.lang='en';}
  }catch(e){}})();
</script>
<script src="i18n.js"></script>
<script src="spending-data.js"></script>
</head>
<body>
<a class="skip" href="#explore" id="skiplink">Aller à l'exploration des dépenses</a>
<div class="wrap">

  <!-- 1 · Masthead -->
  <header class="masthead" role="banner">
    <div class="topbar sans">
      <a class="back-link" id="home-link" href="/">← Accueil</a>
      <span class="eyebrow" id="eyebrow">Ormstown Observer · Explorateur des fonds publics</span>
      <div class="lang-group" role="group" aria-label="Langue / Language" id="lang-group">
        <button type="button" id="btn-fr" aria-pressed="true">FR</button>
        <button type="button" id="btn-en" aria-pressed="false">EN</button>
      </div>
    </div>
    <h1 id="title">Où va l'argent d'Ormstown</h1>
    <p class="dek" id="deck"></p>
    <p class="statusline"><span id="status"></span> <span class="upd" id="updated"></span></p>
    <p class="courtesy" id="courtesy"></p>
  </header>

  <div id="data-error" class="acct-note" hidden></div>
  <div class="print-meta" id="print-meta"></div>

  <!-- 2 · Explore (hero: fast glance by category) -->
  <section id="explore" aria-labelledby="explore-h">
    <span class="layer-tag" id="explore-tag"></span>
    <h2 id="explore-h"></h2>
    <p class="section-sub" id="explore-sub"></p>

    <div class="controls sans" id="controls">
      <div class="field"><span class="field-label" id="l-period"></span><div class="seg" id="period-group" role="group" aria-labelledby="l-period"></div></div>
      <div class="field"><span class="field-label" id="l-category"></span><div class="seg" id="category-group" role="group" aria-labelledby="l-category"></div></div>
      <div><button type="button" class="btn secondary" id="f-reset"></button></div>
    </div>
    <p class="summary" id="summary" aria-live="polite"></p>

    <div class="explore-grid">
      <figure>
        <div class="chartbox cats"><canvas id="chart-cats"></canvas></div>
        <figcaption id="cats-caption"></figcaption>
      </figure>
      <div>
        <h3 class="visually-hidden" id="catlist-h"></h3>
        <ul class="cat-list" id="cat-list" aria-labelledby="catlist-h"></ul>
      </div>
    </div>

    <div id="results-wrap" style="margin-top:16px">
      <table class="stack" id="results">
        <caption id="results-caption"></caption>
        <thead><tr></tr></thead>
        <tbody></tbody>
      </table>
      <div class="empty" id="results-empty" hidden></div>
    </div>

    <div class="results-actions sans">
      <button type="button" class="btn" id="dl-view"></button>
      <a class="btn secondary" id="src-link" target="_blank" rel="noopener"></a>
    </div>

    <div class="signals" aria-labelledby="signals-h">
      <h3 id="signals-h"></h3>
      <p class="note" id="signals-note"></p>
      <ul id="signals-list"></ul>
    </div>
  </section>

  <!-- 3 · Snapshot of the selected period -->
  <section id="snapshot" aria-labelledby="snap-h">
    <h2 id="snap-h" class="visually-hidden">La séance en un coup d'œil</h2>
    <div class="snap-grid" id="snap-grid"></div>
    <p class="evidence" id="evidence"></p>
  </section>

  <!-- 3 · Monthly trend -->
  <section id="trend" aria-labelledby="trend-h">
    <h2 id="trend-h"></h2>
    <p class="section-sub" id="trend-sub"></p>
    <figure>
      <div class="chartbox trend"><canvas id="chart-trend"></canvas></div>
      <figcaption><ul class="legend-cues" id="trend-legend"></ul></figcaption>
    </figure>
    <details class="datatable" id="trend-details">
      <summary id="trend-summary"></summary>
      <table class="stack" id="trend-table">
        <caption id="trend-caption"></caption>
        <thead><tr></tr></thead>
        <tbody></tbody>
      </table>
    </details>
  </section>

  <!-- 5 · Annual context -->
  <section id="annual" aria-labelledby="annual-h">
    <h2 id="annual-h"></h2>
    <p class="acct-note" id="acct-note"></p>
    <p class="scale-line" id="scale-line"></p>
    <span class="scale-tag" id="scale-tag"></span>
    <h3 id="budget-h" style="font-size:1.05rem;margin-top:4px"></h3>
    <p class="section-sub" id="budget-sub"></p>
    <div class="budget-toolbar sans">
      <div class="field"><label for="b-sort" id="l-bsort"></label><select id="b-sort" style="min-height:44px;border:1px solid var(--line);border-radius:7px;padding:0 10px"></select></div>
    </div>
    <figure>
      <div class="chartbox budget"><canvas id="chart-budget"></canvas></div>
      <figcaption id="budget-figcap"></figcaption>
    </figure>
    <details class="datatable" id="budget-details">
      <summary id="budget-summary"></summary>
      <table class="stack" id="budget-table">
        <caption id="budget-caption"></caption>
        <thead><tr></tr></thead>
        <tbody></tbody>
      </table>
    </details>
    <p class="section-sub sans" id="budget-src" style="margin-top:10px"></p>
  </section>

  <!-- 6 · Capital projects -->
  <section id="capital" aria-labelledby="capital-h">
    <h2 id="capital-h"></h2>
    <p class="section-sub" id="capital-sub"></p>
    <div class="cards" id="pti-cards"></div>
    <details class="datatable" id="acronyms">
      <summary id="acronyms-h"></summary>
      <dl class="inner" id="acronyms-list" style="padding:10px 2px 14px;font:.86rem/1.6 -apple-system,sans-serif"></dl>
    </details>
  </section>

  <!-- 7 · Verify & reuse -->
  <section id="verify" aria-labelledby="verify-h">
    <h2 id="verify-h"></h2>

    <h3 id="coverage-h" style="font-size:1.05rem;margin-top:12px"></h3>
    <p class="section-sub" id="coverage-sub"></p>
    <table class="stack" id="coverage-table">
      <caption class="visually-hidden" id="coverage-caption"></caption>
      <thead><tr></tr></thead>
      <tbody></tbody>
    </table>

    <details id="meth-details">
      <summary id="methodology-h"></summary>
      <ul class="inner" id="meth-list"></ul>
    </details>

    <details id="docs-details">
      <summary id="docs-h"></summary>
      <ul class="inner doclist" id="doc-list"></ul>
    </details>

    <details id="dict-details">
      <summary id="dict-h"></summary>
      <dl class="inner" id="dict-list" style="font:.86rem/1.6 -apple-system,sans-serif"></dl>
    </details>

    <div class="results-actions sans">
      <button type="button" class="btn" id="dl-all"></button>
      <button type="button" class="btn secondary" id="print-btn"></button>
    </div>
  </section>

  <footer id="footer"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
