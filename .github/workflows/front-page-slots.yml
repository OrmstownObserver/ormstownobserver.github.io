# Builds front-page-slots.json from the hand-edited front-page-slots.yml.
# Runs when the slots file, an article page, an image or the builder changes,
# and from the Actions tab ("Run workflow"). If a slot is wrong the run fails,
# GitHub emails the person who pushed, and the homepage keeps the last good file.
name: Front page slots

on:
  push:
    branches: [main]
    paths:
      - front-page-slots.yml
      - scripts/build_front_page_slots.py
      - "en/**/index.html"
      - "fr/**/index.html"
      - "images/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: front-page-slots
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml==6.0.2

      - name: Build front-page-slots.json
        run: python3 scripts/build_front_page_slots.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- front-page-slots.json && git ls-files --error-unmatch front-page-slots.json >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Front page unchanged."; exit 0
          fi
          git config user.name "observer-front-page[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add front-page-slots.json
          git commit -m "front page: rebuild slots from front-page-slots.yml"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN may not start a Pages build on their own,
      # so ask for one explicitly.
      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; the next push will deploy it."
