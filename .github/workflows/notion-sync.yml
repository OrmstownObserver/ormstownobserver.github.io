# Publishes Notion edits: every Articles row with "🚀 Publish Requested"
# ticked is copied to its EN/FR pages (scripts/notion_sync.py), the
# front-page cards are rebuilt, and the box is unticked. Runs every 10
# minutes and from the Actions tab ("Run workflow", with a dry-run option).
# Needs the repo secret NOTION_TOKEN; without it the run skips quietly.
name: Notion sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change, publish nothing"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: site-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - name: Check for the Notion token
        id: token
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::warning::NOTION_TOKEN secret is not set; nothing to do."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.token.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Copy ticked Notion stories to the site
        if: steps.token.outputs.ok == 'true'
        run: python3 scripts/notion_sync.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Rebuild front-page cards
        if: steps.token.outputs.ok == 'true' && !inputs.dry_run
        run: |
          pip install pyyaml==6.0.2
          python3 scripts/build_front_page_slots.py

      - name: Commit and publish
        if: steps.token.outputs.ok == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- en fr front-page-slots.json)" ]; then
            echo "Nothing changed on the site."; exit 0
          fi
          git config user.name "observer-notion-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en fr front-page-slots.json
          git commit -m "Publish Notion edits"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; the next push will deploy it."
